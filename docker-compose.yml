services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-symphonia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symphonia}
      POSTGRES_DB: ${POSTGRES_DB:-symphonia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-symphonia} -d ${POSTGRES_DB:-symphonia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-symphonia}:${POSTGRES_PASSWORD:-symphonia}@postgres:5432/${POSTGRES_DB:-symphonia}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
